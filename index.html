<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Selector APP</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --surface2: #21262d;
  --border:   #30363d;
  --accent:   #c0392b;
  --accent-h: #e74c3c;
  --green:    #27ae60;
  --green-h:  #2ecc71;
  --text:     #e6edf3;
  --muted:    #8b949e;
  --sel-bg:   rgba(192,57,43,0.12);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system,'Segoe UI',Arial,sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 14px;
}

/* ── HEADER ─────────────────────────────────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 11px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.header-left { flex: 1; }
.header-title { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
.header-sub   { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }

/* ── BUTTONS ────────────────────────────────────────────────── */
.btn {
  border: none; border-radius: 6px; padding: 7px 13px;
  font-size: 0.8rem; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-h); }

.btn-ghost {
  background: var(--surface2); color: var(--muted);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--border); color: var(--text); }

.btn-print {
  background: var(--green); color: #fff;
  font-size: 0.93rem; padding: 11px 26px; font-weight: 700;
}
.btn-print:hover { background: var(--green-h); }
.btn-print:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }

/* ── TAB BAR ─────────────────────────────────────────────────── */
.tab-bar {
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  display: flex;
  padding: 0 20px;
  gap: 2px;
  position: sticky;
  top: 52px;
  z-index: 190;
}

.tab-btn {
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  padding: 10px 18px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}

.tab-btn:hover { color: var(--text); }

.tab-btn.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}

.tab-badge {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  min-width: 28px;
  text-align: center;
}

.tab-btn.active .tab-badge { background: var(--sel-bg); border-color: var(--accent); color: var(--accent); }
.tab-btn .tab-badge.has-sel { background: var(--sel-bg); border-color: var(--accent); color: var(--accent); }

/* ── PANELS ──────────────────────────────────────────────────── */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── MAIN ────────────────────────────────────────────────────── */
.main { flex: 1; padding: 16px 20px; }

.notice {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: 0.8rem;
  color: var(--muted);
  line-height: 1.65;
}
.notice strong { color: var(--text); }
.notice kbd {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 3px; padding: 1px 5px;
  font-family: monospace; font-size: 0.75rem; color: var(--text);
}

/* ── TOOLBAR ─────────────────────────────────────────────────── */
.toolbar {
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 13px; flex-wrap: wrap;
}
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 1px; }

.loaded-badge {
  margin-left: auto; font-size: 0.74rem; color: var(--muted);
  background: var(--surface2); border: 1px solid var(--border);
  padding: 3px 10px; border-radius: 10px;
}
.loaded-badge.full { color: var(--green); border-color: var(--green); }

/* ── PAGE GRID ───────────────────────────────────────────────── */
.page-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 12px;
}

/* ── PAGE CARD ───────────────────────────────────────────────── */
.page-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .1s;
  user-select: none;
}
.page-card:hover { border-color: var(--muted); transform: translateY(-2px); }
.page-card.selected {
  border-color: var(--accent);
  background: var(--sel-bg);
  box-shadow: 0 0 0 1px var(--accent);
}

/* ── THUMBNAIL ───────────────────────────────────────────────── */
.thumb {
  position: relative;
  width: 100%; aspect-ratio: 11/15;
  background: var(--surface2);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.thumb img {
  width: 100%; height: 100%; object-fit: contain;
  display: block; pointer-events: none;
}
.placeholder {
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
  color: var(--muted); font-size: 0.75rem;
}
.placeholder .ico { font-size: 1.9rem; opacity: 0.22; }

.check-badge {
  position: absolute; top: 7px; right: 7px;
  width: 23px; height: 23px; border-radius: 50%;
  border: 2px solid var(--border);
  background: rgba(13,17,23,.85);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 700;
  color: transparent; transition: all .15s;
  pointer-events: none;
}
.page-card.selected .check-badge {
  background: var(--accent); border-color: var(--accent); color: #fff;
}

.load-single {
  position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
  background: rgba(192,57,43,.9); color: #fff; border: none;
  padding: 3px 9px; border-radius: 4px;
  font-size: 0.67rem; font-weight: 600; cursor: pointer;
  white-space: nowrap; opacity: 0; transition: opacity .15s;
}
.page-card:hover .load-single { opacity: 1; }

/* ── CARD FOOTER ─────────────────────────────────────────────── */
.card-footer {
  padding: 7px 9px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); gap: 6px;
}
.page-lbl { font-size: 0.74rem; font-weight: 600; color: var(--muted); }
.page-card.selected .page-lbl { color: var(--accent); }

.copies-row { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.copies-row .lbl { font-size: 0.68rem; color: var(--muted); }
.copies-in {
  width: 40px; background: var(--bg);
  border: 1px solid var(--border); color: var(--text);
  padding: 3px 4px; border-radius: 4px;
  font-size: 0.78rem; text-align: center;
}
.copies-in:focus { outline: none; border-color: var(--accent); }

/* ── PRINT BAR ───────────────────────────────────────────────── */
.print-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 20px;
  display: flex; align-items: center;
  justify-content: space-between; gap: 16px;
  position: sticky; bottom: 0;
  box-shadow: 0 -2px 8px rgba(0,0,0,.3);
}
.print-info { line-height: 1.5; }
.print-count { font-size: 0.88rem; color: var(--muted); }
.print-count .n { color: var(--accent); font-weight: 700; font-size: 1.02rem; }
.pages-list { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

/* ── PRINT MEDIA ─────────────────────────────────────────────── */
@page { size: 11in 15in; margin: 0; }

@media print {
  * { visibility: hidden !important; }
  #print-area, #print-area * { visibility: visible !important; }
  #print-area {
    position: fixed !important; top: 0 !important; left: 0 !important;
    width: 11in !important; height: 15in !important; display: block !important;
  }
  .print-page {
    page-break-after: always;
    width: 11in; height: 15in;
    display: flex !important;
    align-items: center; justify-content: center;
    margin: 0; padding: 0;
    overflow: hidden;
  }
  .print-page:last-child { page-break-after: avoid; }
  .print-page img { width: 11in; height: 15in; object-fit: fill; display: block; }
}

#print-area { display: none; }
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────── -->
<div class="header">
  <div class="header-left">
    <div class="header-title">Print Selector APP</div>
    <div class="header-sub">4 Varieties &times; 12 Pages</div>
  </div>
  <label class="btn btn-primary" style="cursor:pointer" title="Load images for the currently active tab">
    📂 Load Pages (Current Tab)
    <input id="fileInput" type="file" multiple accept="image/*" style="display:none"
           onchange="loadAllImages(this.files)">
  </label>
</div>

<!-- ── TAB BAR ─────────────────────────────────────────────── -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="0" onclick="switchTab(0)">
    Arabica <span class="tab-badge" id="badge-0">0/12</span>
  </button>
  <button class="tab-btn" data-tab="1" onclick="switchTab(1)">
    Barako <span class="tab-badge" id="badge-1">0/12</span>
  </button>
  <button class="tab-btn" data-tab="2" onclick="switchTab(2)">
    Robusta <span class="tab-badge" id="badge-2">0/12</span>
  </button>
  <button class="tab-btn" data-tab="3" onclick="switchTab(3)">
    Pahimis Special <span class="tab-badge" id="badge-3">0/12</span>
  </button>
</div>

<!-- ── MAIN ────────────────────────────────────────────────── -->
<div class="main" id="mainArea"></div>

<!-- ── PRINT BAR ───────────────────────────────────────────── -->
<div class="print-bar">
  <div class="print-info" id="printInfo">
    <div class="print-count">No pages selected</div>
  </div>
  <button class="btn btn-print" id="printBtn" onclick="doPrint()" disabled>
    🖨️&nbsp; Print Selected
  </button>
</div>

<!-- ── PRINT AREA ───────────────────────────────────────────── -->
<div id="print-area"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
const TABS    = ['arabica', 'barako', 'robusta', 'pahimis'];
const LABELS  = ['Arabica', 'Barako', 'Robusta', 'Pahimis Special'];
const N       = 12;

// ── STATE: state[tabIdx][pageIdx] ─────────────────────────────
const state = TABS.map(() =>
  Array.from({length: N}, (_, i) => ({
    page: i + 1, src: null, selected: false, copies: 1
  }))
);

let activeTab = 0;

// ── SWITCH TAB ────────────────────────────────────────────────
function switchTab(idx) {
  activeTab = idx;

  document.querySelectorAll('.tab-btn').forEach((btn, i) =>
    btn.classList.toggle('active', i === idx)
  );

  renderPanel();
}

// ── RENDER PANEL ──────────────────────────────────────────────
function renderPanel() {
  const main = document.getElementById('mainArea');
  const tab  = activeTab;
  const pages = state[tab];

  const loaded = pages.filter(s => s.src).length;
  const sel    = pages.filter(s => s.selected).length;

  main.innerHTML = `
    <div class="notice" id="notice-${tab}" style="${loaded > 0 ? 'display:none' : ''}">
      <strong>Load images for ${LABELS[tab]}:</strong>
      Click <strong>📂 Load Pages (Current Tab)</strong> and select the 12 images for this variety
      (hold <kbd>Ctrl</kbd> to pick multiple files at once).<br>
      &mdash; Or double-click <strong>AUTO_EXTRACT.bat</strong> to extract all varieties automatically.
    </div>

    <div class="toolbar">
      <button class="btn btn-ghost" onclick="selectAll(${tab})">✓ Select All</button>
      <button class="btn btn-ghost" onclick="deselectAll(${tab})">✗ Deselect All</button>
      <div class="sep"></div>
      <button class="btn btn-ghost" onclick="setAllCopies(${tab})">📋 Set All Copies</button>
      <div class="sep"></div>
      <button class="btn btn-ghost" onclick="resetTab(${tab})">↺ Reset Tab</button>
      <span class="loaded-badge ${loaded === N ? 'full' : ''}" id="loaded-${tab}">${loaded} / ${N} loaded</span>
    </div>

    <div class="page-grid" id="grid-${tab}"></div>
  `;

  pages.forEach((s, idx) => appendCard(tab, idx));
  syncBar();
}

// ── BUILD A CARD ──────────────────────────────────────────────
function appendCard(tab, idx) {
  const s    = state[tab][idx];
  const grid = document.getElementById('grid-' + tab);
  if (!grid) return;

  const card = document.createElement('div');
  card.className = 'page-card' + (s.selected ? ' selected' : '');
  card.id = `c-${tab}-${s.page}`;

  const thumbContent = s.src
    ? `<img src="${s.src}" alt="Page ${s.page}" loading="lazy">`
    : `<div class="placeholder"><div class="ico">📄</div><span>Page ${s.page}</span></div>`;

  card.innerHTML = `
    <div class="thumb" onclick="toggle(${tab},${idx})">
      ${thumbContent}
      <div class="check-badge">${s.selected ? '✓' : ''}</div>
      <label class="load-single" onclick="event.stopPropagation()">
        Load Image
        <input type="file" accept="image/*" style="display:none"
               onchange="loadOne(${tab},${idx},this)"
               onclick="event.stopPropagation()">
      </label>
    </div>
    <div class="card-footer">
      <span class="page-lbl">Page ${s.page}</span>
      <div class="copies-row">
        <span class="lbl">Copies:</span>
        <input type="number" class="copies-in" value="${s.copies}"
               min="1" max="99"
               onclick="event.stopPropagation()"
               oninput="setCopies(${tab},${idx},this.value)"
               onchange="setCopies(${tab},${idx},this.value)">
      </div>
    </div>`;

  grid.appendChild(card);
}

// ── TOGGLE ────────────────────────────────────────────────────
function toggle(tab, idx) {
  const s    = state[tab][idx];
  s.selected = !s.selected;

  const card  = document.getElementById(`c-${tab}-${s.page}`);
  const badge = card.querySelector('.check-badge');
  if (s.selected) {
    card.classList.add('selected');
    badge.textContent = '✓';
  } else {
    card.classList.remove('selected');
    badge.textContent = '';
  }
  syncBadge(tab);
  syncBar();
}

function setCopies(tab, idx, v) {
  const n = Math.max(1, Math.min(99, parseInt(v) || 1));
  state[tab][idx].copies = n;
  const inp = document.querySelector(`#c-${tab}-${state[tab][idx].page} .copies-in`);
  if (inp) inp.value = n;
  syncBar();
}

function selectAll(tab)   { state[tab].forEach((s,i) => { if (!s.selected) toggle(tab,i); }); }
function deselectAll(tab) { state[tab].forEach((s,i) => { if (s.selected)  toggle(tab,i); }); }

function setAllCopies(tab) {
  const v = prompt(`Copies for ALL 12 pages in ${LABELS[tab]}:`, '1');
  if (v === null) return;
  state[tab].forEach((s,i) => setCopies(tab,i,v));
}

function resetTab(tab) {
  deselectAll(tab);
  state[tab].forEach((s,i) => setCopies(tab,i,1));
}

// ── IMAGE LOADING ─────────────────────────────────────────────
function loadAllImages(files) {
  const tab = activeTab;
  const arr = Array.from(files).sort((a,b) =>
    a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'})
  );

  arr.forEach((file, i) => {
    if (i >= N) return;
    const r = new FileReader();
    r.onload = e => {
      state[tab][i].src = e.target.result;
      patchThumb(tab, i);
      syncLoaded(tab);
    };
    r.readAsDataURL(file);
  });

  const notice = document.getElementById('notice-' + tab);
  if (notice) notice.style.display = 'none';
}

function loadOne(tab, idx, inp) {
  const file = inp.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    state[tab][idx].src = e.target.result;
    patchThumb(tab, idx);
    syncLoaded(tab);
    const notice = document.getElementById('notice-' + tab);
    if (notice) notice.style.display = 'none';
  };
  r.readAsDataURL(file);
}

function patchThumb(tab, idx) {
  const s     = state[tab][idx];
  const thumb = document.querySelector(`#c-${tab}-${s.page} .thumb`);
  if (!thumb) return;
  const badge = thumb.querySelector('.check-badge');
  const ph    = thumb.querySelector('.placeholder');
  const img   = thumb.querySelector('img');
  if (img) {
    img.src = s.src;
  } else {
    if (ph) ph.remove();
    const el = document.createElement('img');
    el.src = s.src; el.alt = 'Page ' + s.page; el.loading = 'lazy';
    thumb.insertBefore(el, badge);
  }
}

// ── AUTO-LOAD FROM SERVER ────────────────────────────────────
async function tryServerLoad() {
  if (window.location.protocol === 'file:') return;

  const jobs = TABS.flatMap((slug, tab) =>
    state[tab].map(async (s, idx) => {
      const url = `pages/${slug}/page${String(s.page).padStart(2,'0')}.png`;
      try {
        const res = await fetch(url, {method:'HEAD'});
        if (res.ok) { s.src = url; patchThumb(tab, idx); }
      } catch (_) {}
    })
  );

  await Promise.all(jobs);
  TABS.forEach((_, t) => syncLoaded(t));

  const anyLoaded = state.some(tab => tab.some(s => s.src));
  if (anyLoaded) {
    document.querySelectorAll('[id^="notice-"]').forEach(n => n.style.display = 'none');
  }
}

// ── SYNC HELPERS ─────────────────────────────────────────────
function syncLoaded(tab) {
  const loaded = state[tab].filter(s => s.src).length;
  const el = document.getElementById('loaded-' + tab);
  if (el) {
    el.textContent = `${loaded} / ${N} loaded`;
    el.className   = 'loaded-badge' + (loaded === N ? ' full' : '');
  }
  syncBadge(tab);
}

function syncBadge(tab) {
  const sel    = state[tab].filter(s => s.selected).length;
  const badge  = document.getElementById('badge-' + tab);
  const tabBtn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
  if (!badge) return;
  badge.textContent = sel > 0 ? `${sel} sel` : `${state[tab].filter(s=>s.src).length}/${N}`;
  badge.classList.toggle('has-sel', sel > 0);
  if (tabBtn) tabBtn.classList.toggle('active', tab === activeTab);
}

function syncBar() {
  const allSel    = state.flatMap((tab, ti) => tab.filter(s => s.selected).map(s => ({...s, tab: ti})));
  const sheets    = allSel.reduce((a,s) => a + s.copies, 0);
  const info      = document.getElementById('printInfo');
  const btn       = document.getElementById('printBtn');

  if (allSel.length === 0) {
    info.innerHTML = '<div class="print-count">No pages selected &mdash; click any page to select it</div>';
    btn.disabled   = true;
    return;
  }

  // Group by tab for display
  const byTab = TABS.map((_, ti) => {
    const sel = allSel.filter(s => s.tab === ti);
    if (!sel.length) return null;
    return `<strong>${LABELS[ti]}:</strong> ` +
      sel.map(s => `P${s.page}${s.copies>1?' ×'+s.copies:''}`).join(' ');
  }).filter(Boolean);

  info.innerHTML = `
    <div class="print-count">
      <span class="n">${allSel.length}</span> page${allSel.length>1?'s':''} selected &nbsp;&mdash;&nbsp;
      <span class="n">${sheets}</span> sheet${sheets>1?'s':''} to print
    </div>
    <div class="pages-list">${byTab.join('&emsp;|&emsp;')}</div>`;
  btn.disabled = false;
}

// ── PRINT ────────────────────────────────────────────────────
function doPrint() {
  const allSel = state.flatMap((tab, ti) =>
    tab.filter(s => s.selected).map(s => ({...s, tabIdx: ti}))
  );
  if (!allSel.length) return;

  const missing = allSel.filter(s => !s.src);
  if (missing.length) {
    const ok = confirm(
      `${missing.length} selected page(s) have no image loaded.\n` +
      missing.map(s => `${LABELS[s.tabIdx]} Page ${s.page}`).join(', ') +
      '\n\nPrint anyway?'
    );
    if (!ok) return;
  }

  const area = document.getElementById('print-area');
  area.innerHTML = '';

  allSel.forEach(s => {
    for (let c = 0; c < s.copies; c++) {
      const pg = document.createElement('div');
      pg.className = 'print-page';
      if (s.src) {
        const img = document.createElement('img');
        img.src = s.src;
        img.alt = `${LABELS[s.tabIdx]} Page ${s.page}`;
        pg.appendChild(img);
      } else {
        pg.innerHTML = `<div style="font-size:18px;font-family:sans-serif;color:#999">${LABELS[s.tabIdx]} Page ${s.page} — no image</div>`;
      }
      area.appendChild(pg);
    }
  });

  requestAnimationFrame(() => setTimeout(() => window.print(), 150));
}

// ── INIT ─────────────────────────────────────────────────────
renderPanel();
tryServerLoad();
</script>
</body>
</html>
